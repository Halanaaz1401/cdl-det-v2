title: New Windows Service Created for Persistence
id: e6f7a8b9-0123-45ab-cdef-666666666666
status: test
description: Detects creation of new Windows system services using sc.exe to maintain persistence.
references:
    - https://attack.mitre.org/techniques/T1543/003/
author: Cyberion Defense Labs
date: 2026/08/05
tags:
    - attack.persistence
    - attack.t1543.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\sc.exe'
        CommandLine|contains: ' create '
    condition: selection
falsepositives:
    - Software installers adding legitimate background services.
level: medium