title: Data Exfiltration via Command Line FTP
id: f7a8b9c0-1234-56ab-cdef-777777777777
status: test
description: Detects potential exfiltration activity using interactive command-line FTP client scripts.
references:
    - https://attack.mitre.org/techniques/T1041/
author: Cyberion Defense Labs
date: 2026/08/05
tags:
    - attack.exfiltration
    - attack.t1041
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\ftp.exe'
        CommandLine|contains: ' -s:'
    condition: selection
falsepositives:
    - Scheduled legacy backup tasks using FTP scripts.
level: medium
