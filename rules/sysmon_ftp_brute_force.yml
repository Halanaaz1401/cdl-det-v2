title: Potential FTP Brute Force or Multiple Logon Failures
id: f1a2b3c4-5678-90ab-cdef-111111111111
status: test
description: Detects command-line FTP execution or repeated failed authentication events indicating potential brute force activity.
references:
    - https://attack.mitre.org/techniques/T1110/
author: Cyberion Defense Labs
date: 2026/08/05
tags:
    - attack.credential-access
    - attack.t1110
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\ftp.exe'
    condition: selection
falsepositives:
    - Legitimate administrative FTP file transfers or automated maintenance scripts.
level: medium