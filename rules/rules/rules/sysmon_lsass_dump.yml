title: LSASS Memory Dumping via Mimikatz Process Access
id: a2b3c4d5-6789-01ab-cdef-222222222222
status: test
description: Detects process access or execution targeting LSASS memory for credential dumping.
references:
    - https://attack.mitre.org/techniques/T1003/001/
author: Cyberion Defense Labs
date: 2026/08/05
tags:
    - attack.credential-access
    - attack.t1003.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains:
            - 'securlsa::logonpasswords'
            - 'lsadump::sam'
    condition: selection
falsepositives:
    - Authorized penetration testing or security auditing activities.
level: high