title: Suspicious Command Shell Execution
id: c4d5e6f7-8901-23ab-cdef-444444444444
status: test
description: Detects command shell execution spawning suspicious utilities or background discovery commands.
references:
    - https://attack.mitre.org/techniques/T1059/003/
author: Cyberion Defense Labs
date: 2026/08/05
tags:
    - attack.execution
    - attack.t1059.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\cmd.exe'
        CommandLine|contains:
            - '/c whoami'
            - '/c net user'
    condition: selection
falsepositives:
    - Normal system administration scripts.
level: low