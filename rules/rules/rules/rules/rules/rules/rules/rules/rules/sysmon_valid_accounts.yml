title: Suspicious Use of Valid Local Administrator Credentials
id: a8b9c0d1-2345-67ab-cdef-888888888888
status: test
description: Detects logon sessions involving built-in administrator accounts from unusual logon sources.
references:
    - https://attack.mitre.org/techniques/T1078/
author: Cyberion Defense Labs
date: 2026/08/05
tags:
    - attack.defense-evasion
    - attack.t1078
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        CommandLine|contains: 'Administrator'
    condition: selection
falsepositives:
    - Routine IT support ticket resolutions.
level: low