title: Encoded PowerShell Command Execution
id: b3c4d5e6-7890-12ab-cdef-333333333333
status: test
description: Detects execution of PowerShell commands using encoded arguments (-e, -enc, -encodedcommand).
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: Cyberion Defense Labs
date: 2026/08/05
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\powershell.exe'
        CommandLine|contains:
            - ' -e '
            - ' -enc '
            - ' -encodedcommand '
    condition: selection
falsepositives:
    - Legitimate administrative management scripts using encoded strings.
level: medium