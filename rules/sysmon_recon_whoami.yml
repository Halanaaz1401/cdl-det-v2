title: System Discovery via Whoami Command Execution
id: f2a3b4c5-6789-01ab-cdef-222222222222
status: test
description: Detects execution of whoami.exe used by adversaries during initial access discovery phases.
references:
    - https://attack.mitre.org/techniques/T1033/
author: Cyberion Defense Labs
date: 2026/08/09
tags:
    - attack.discovery
    - attack.t1033
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\whoami.exe'
    condition: selection
falsepositives:
    - System administrator troubleshooting sessions or login script executions.
level: low
