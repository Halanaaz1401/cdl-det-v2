title: Correlation - PowerShell Spawning LSASS Dumping Activity
id: c0d1e2f3-4567-89ab-cdef-101010101010
status: test
description: Sequential correlation rule detecting PowerShell launching subprocesses that target LSASS memory.
references:
    - https://attack.mitre.org/techniques/T1003/001/
    - https://attack.mitre.org/techniques/T1059/001/
author: Cyberion Defense Labs
date: 2026/08/05
tags:
    - attack.credential-access
    - attack.execution
    - attack.t1003.001
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    parent_process:
        ParentImage|endswith: '\powershell.exe'
    child_process:
        CommandLine|contains:
            - 'securlsa'
            - 'lsass'
    condition: parent_process and child_process
falsepositives:
    - None expected in standard production environments.
level: high