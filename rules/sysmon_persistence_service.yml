title: Persistence via Windows Service Creation Control Manager
id: f3a4b5c6-7890-12ab-cdef-333333333333
status: test
description: Detects creation of new Windows services via sc.exe for persistence or privilege escalation.
references:
    - https://attack.mitre.org/techniques/T1543.003/
author: Cyberion Defense Labs
date: 2026/08/09
tags:
    - attack.persistence
    - attack.privilege-escalation
    - attack.t1543.003
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith: '\sc.exe'
        CommandLine|contains: 'create'
    condition: selection
falsepositives:
    - Software installers or legitimate IT administration automation tasks.
level: medium